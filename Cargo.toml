[package]
name = "iron_renamer"
version = "0.4.4"
edition = "2024"
license = "MIT"

[dependencies]
# Sandboxed JS rules; no IO exposed by design.
boa_engine = "0.22.0"
clap = { version = "4.6.6", features = ["derive"] }
crc32fast = "1.5.1"
# Zero-dependency hash tags <md5> and <sha1>.
md5 = "0.8.1"
sha1_smol = "1.0.1"
regex = "1.13.1"
slint = { version = "1.17.1", default-features = false, features = ["accessibility", "compat-1-2", "renderer-femtovg", "std", "unstable-winit-030"] } # winit feature: OS file drag-and-drop
rfd = "0.17.2"
nom-exif = "3.7.0"
lofty = "0.25.1"
imagesize = "0.15.0"
little_exif = "0.6.23"

[build-dependencies]
slint-build = "1.17.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
proptest = "1.11.0"
# Headless slint platform, so GUI callback wiring can be driven from tests.
i-slint-backend-testing = "1.17.1"

[profile.profiling]
inherits = "release"
debug = 1
