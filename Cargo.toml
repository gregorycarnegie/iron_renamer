[package]
name = "iron_renamer"
version = "0.4.4"
edition = "2024"
license = "MIT"

[dependencies]
# Sandboxed JS rules; no IO exposed by design.
boa_engine = "0.22.0"
clap = { version = "4.6.8", features = ["derive"] }
crc32fast = "1.5.5"
# Zero-dependency hash tags <md5> and <sha1>.
md5 = "0.8.1"
sha1_smol = "1.0.1"
regex = "1.13.2"
slint = { version = "1.19.0", default-features = false, features = ["accessibility", "compat-1-2", "renderer-femtovg", "std", "unstable-winit-030"] } # winit feature: OS file drag-and-drop
rfd = "0.18.0"
nom-exif = "3.8.0"
lofty = "0.25.5"
imagesize = "0.15.0"
little_exif = "0.6.23"
# Keep aligned with the pinned Verus release in CI.
vstd = "=0.0.0-2026-11-01-0251"

[build-dependencies]
slint-build = "1.19.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
proptest = "1.12.0"
# Headless slint platform, so GUI callback wiring can be driven from tests.
i-slint-backend-testing = "1.19.0"
rstest = { version = "0.28.0", default-features = false }
googletest = "0.14.4"

[profile.profiling]
inherits = "release"
debug = 1
